<title>Driftleaf — Support</title>
<!--
  This page used to be a second copy of the Driftleaf support page. Two copies
  meant two places to fix every time something changed, and the day Google Play
  went live both of them were still saying "soon".

  The App Store and Google Play listings both register /support/driftleaf/ as
  Driftleaf's support and privacy address, and changing a store's registered URL
  costs a review — so that copy is the one that stays, and this address forwards
  to it. Anything already linking here keeps working.
-->
<link rel="canonical" href="https://burakgogcegoz.github.io/support/driftleaf/">
<meta http-equiv="refresh" content="0; url=https://burakgogcegoz.github.io/support/driftleaf/">
<style>
  :root { color-scheme: light dark; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f7f9f8; color:#2f464c; padding:24px; text-align:center;
  }
  @media (prefers-color-scheme: dark) { body { background:#111a1c; color:#d7e3e2; } }
  a { color:#3f8f84; }
</style>
</head>
<body>

  <a href="https://burakgogcegoz.github.io/support/driftleaf/">burakgogcegoz.github.io/support/driftleaf/</a>.</p>
  <script>location.replace('https://burakgogcegoz.github.io/support/driftleaf/');</script>
</body>
